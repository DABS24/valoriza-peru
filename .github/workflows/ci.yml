# CI de ValorizaPeru.
#
# Por qué existe: el estándar dice que "una regla sin script que la valide se
# rompe" — y su corolario, que se descubrió después: un script que nadie ejecuta
# tampoco vale. El gate dependía de que alguien se acordara de correrlo, y el
# 2026-07-25 no se corrió: se mergeó a main con voceo adentro. Esto lo cierra.
#
# El gate del estándar (balarezo-web) NO corre acá a propósito: lo que revisa
# —líneas rojas SMV, páginas legales, accesibilidad, idioma del código— no cambia
# entre un commit y otro. Es auditoría, no verificación por commit, y se corre a
# mano cada tanto:
#     bash ~/.claude/skills/balarezo-web/scripts/gate.sh
#
# ⚠️ Esto AVISA, no bloquea, hasta que se marque como *required status check*
# para `main` en Settings → Branches. Un semáforo que se puede cruzar en rojo no
# es una barrera.
name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

# Dos pushes seguidos a la misma rama: se cancela la corrida vieja. Sin esto,
# cada corrección de un typo deja corriendo la anterior, que ya no importa.
# ⚠️ En `main` NO se cancela: ahí cada commit es un deploy, y querés el
# resultado de cada uno aunque llegue tarde.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --ignore-scripts: un paquete transitivo comprometido lee las variables
      # de entorno en un script de post-instalación (OWASP A03:2025).
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # ── Orden por COSTO: primero lo que tarda segundos. ──────────────────
      # Si el gate falla, no tiene sentido haber esperado el build.

      # ⚠️ El gate usa GNU grep (acá) y en una Mac es BSD: los patrones se
      # comportan distinto. Si algo pasa local y falla acá, empezá por ahí.
      - name: Gate del repo
        run: bash scripts/precommit-checks.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Reusa la compilación anterior. Sin esto, cada corrida compila de cero.
      # La clave incluye el hash de los fuentes: si cambiaron, se invalida sola.
      - name: Caché de build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Informativo: avisa de vulnerabilidades conocidas sin frenar el deploy.
      # 🔴 No se sube a bloqueante sin antes limpiar lo que ya reporta — un
      # chequeo que falla siempre se ignora, y deja de servir para cuando
      # aparezca la vulnerabilidad que sí importa.
      - name: Auditoría de dependencias (informativa)
        run: npm audit --audit-level=high || true
