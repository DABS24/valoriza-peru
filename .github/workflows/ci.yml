# CI de ValorizaPeru.
#
# Por qué existe: el estándar dice que "una regla sin script que la valide se
# rompe" — y su corolario, que se descubrió después: un script que nadie ejecuta
# tampoco vale. Hasta hoy el gate dependía de que alguien se acordara de correrlo.
#
# Acá corre lo que tiene que pasar en CADA push: el gate del repo, tipos, lint,
# tests y build.
#
# El gate del estándar (balarezo-web) NO corre acá a propósito: lo que revisa
# —líneas rojas SMV, páginas legales, accesibilidad, idioma del código— no cambia
# entre un commit y otro. Es auditoría, no verificación por commit, y se corre a
# mano cada tanto:
#     bash ~/.claude/skills/balarezo-web/scripts/gate.sh
name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --ignore-scripts: un paquete transitivo comprometido lee las variables
      # de entorno en un script de post-instalación (OWASP A03:2025).
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Gate del repo
        run: bash scripts/precommit-checks.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
